ShortDescription: Battery levels of wireless keyboards, mice, headsets and controllers on the Windows taskbar.
Description: |-
  Shows the battery level of your wireless keyboards, mice, headsets, earbuds and game controllers
  inside the Windows taskbar, on the monitor you choose. Supports Bluetooth headphones, BLE keyboards
  and mice (including both halves of ZMK split keyboards), Logitech Unifying, Bolt and Lightspeed
  receivers, SteelSeries Arctis Nova 7 and the Sony DualShock 4. Includes wbt, a command-line tool
  that prints every battery once.
