name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Fails if any commit in the history credits an AI assistant (author, committer, trailers or
  # message). A red CI also stops the automatic release.
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI attribution in commits
        run: |
          bad=$(git log --format='%H%x09%an <%ae>%x09%cn <%ce>%x09%B' HEAD \
            | grep -i -E 'claude|anthropic' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits must not mention Claude or Anthropic (author, committer or message):"
            echo "$bad"
            exit 1
          fi
          echo "Clean: $(git rev-list --count HEAD) commits checked."

  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Shared with release.yml, so a release starts from main's warm cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Tests in the release profile reuse the dependencies the release build needs.
      - run: cargo test --workspace --locked --release

      - run: cargo build --workspace --locked --release
