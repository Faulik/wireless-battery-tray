name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/site_markdown.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Markdown twin of the page for AI agents: /index.md and /llms-full.txt,
      # generated from docs/index.html so the two never drift apart.
      - run: python3 scripts/site_markdown.py docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
