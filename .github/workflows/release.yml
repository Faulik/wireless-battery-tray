name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the Cargo.toml version
        id: version
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'bar').version
          if ($env:TAG -ne "v$version") {
            Write-Error "Tag $env:TAG does not match the workspace version $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: cargo test --workspace --locked

      - run: cargo build --release --workspace --locked

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/batteries-bar.exe, target/release/batteries.exe, README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/batteries_app-$v-windows-x64.zip"
          Copy-Item target/release/batteries-bar.exe dist/
          Get-ChildItem dist -File |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
