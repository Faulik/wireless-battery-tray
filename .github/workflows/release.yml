name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  actions: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Signing runs only once the SignPath token secret exists; until then releases ship unsigned.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # Restores the cache CI saves on main; tag runs don't save their own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false

      - name: Check CI passed on this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = git rev-parse HEAD
          $runs = gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq '.total_count'
          if ([int]$runs -lt 1) {
            Write-Error "No successful CI run for $sha. Push it to main and wait for CI before tagging."
            exit 1
          }

      - name: Check the tag matches the Cargo.toml version
        id: version
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'wireless-battery-tray').version
          if ($env:TAG -ne "v$version") {
            Write-Error "Tag $env:TAG does not match the workspace version $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: cargo build --release --workspace --locked

      # Code signing via SignPath (https://signpath.org). SignPath only signs files built by
      # this workflow on a GitHub-hosted runner, so the exes go up as a workflow artifact,
      # come back signed, and replace the unsigned ones before packaging.
      - name: Upload unsigned exes for signing
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exes
          path: |
            target/release/wireless-battery-tray.exe
            target/release/wbt.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wireless-battery-tray' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing needs a manual approval on signpath.io; allow an hour for it.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Swap in the signed exes and check their signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($exe in 'wireless-battery-tray.exe', 'wbt.exe') {
            $signed = Get-ChildItem signed -Recurse -File -Filter $exe | Select-Object -First 1
            if (-not $signed) { Write-Error "SignPath did not return $exe"; exit 1 }
            $sig = Get-AuthenticodeSignature $signed.FullName
            if ($sig.Status -in 'NotSigned', 'HashMismatch', 'NotSupportedFileFormat') {
              Write-Error "$exe signature is $($sig.Status): $($sig.StatusMessage)"
              exit 1
            }
            # The test-signing policy uses an untrusted certificate, so only warn on other states.
            if ($sig.Status -ne 'Valid') { Write-Warning "$exe signature is $($sig.Status): $($sig.StatusMessage)" }
            Write-Host "$exe signed by $($sig.SignerCertificate.Subject)"
            Copy-Item $signed.FullName "target/release/$exe" -Force
          }

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/wireless-battery-tray.exe, target/release/wbt.exe, README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/wireless-battery-tray-$v-windows-x64.zip"
          Copy-Item target/release/wireless-battery-tray.exe dist/
          Get-ChildItem dist -File |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
