name: Release

# Every merge to main that passes CI and changes more than docs is released as the next patch
# version (see .github/scripts/plan-release.ps1). Pushing a v* tag or running this by hand
# releases that tag instead.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    env:
      EVENT: ${{ github.event_name }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Plan
        id: plan
        shell: pwsh
        run: ./.github/scripts/plan-release.ps1

      - name: Check CI passed on this commit
        if: steps.plan.outputs.skip != 'true' && github.event_name != 'workflow_run'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = git rev-parse HEAD
          $runs = gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq '.total_count'
          if ([int]$runs -lt 1) {
            Write-Error "No successful CI run for $sha. Push it to main and wait for CI before tagging."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.skip != 'true'

      # Restores the cache CI saves on main; release runs don't save their own.
      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.skip != 'true'
        with:
          shared-key: windows
          save-if: false

      # Only in this checkout, so the exe reports the released version; nothing is committed.
      - name: Set version
        if: steps.plan.outputs.skip != 'true'
        shell: pwsh
        run: |
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = "[^"]+"', 'version = "${{ steps.plan.outputs.version }}"' | Set-Content Cargo.toml -NoNewline

      # Not --locked: a version set above also changes the workspace crates' entries in Cargo.lock.
      - if: steps.plan.outputs.skip != 'true'
        run: cargo build --release --workspace

      - name: Package
        if: steps.plan.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.plan.outputs.version }}'
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/wireless-battery-tray.exe, target/release/wbt.exe, README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/wireless-battery-tray-$v-windows-x64.zip"
          Copy-Item target/release/wireless-battery-tray.exe dist/
          Get-ChildItem dist -File |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # Tags pushed with the workflow token don't start another run of this workflow.
      - name: Tag
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.create_tag == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a '${{ steps.plan.outputs.tag }}' -m '${{ steps.plan.outputs.tag }}' HEAD
          git push origin '${{ steps.plan.outputs.tag }}'

      - uses: softprops/action-gh-release@v2
        if: steps.plan.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          name: ${{ steps.plan.outputs.tag }}
          generate_release_notes: true
          files: dist/*
